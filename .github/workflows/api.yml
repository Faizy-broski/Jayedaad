name: api

on:
  pull_request:
    paths:
      - "services/api/**"
      - "packages/**"
  push:
    branches: [main]
    paths:
      - "services/api/**"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jayedaad/api typecheck
      - run: pnpm --filter @jayedaad/api lint
      # RBAC test suite [Dev Instr §4]: automated tests hitting the API directly.
      # DB-backed schema now lives in supabase/migrations, applied via Supabase
      # CLI against a real project — not run in this CI job (no project linked yet).
      - run: pnpm --filter @jayedaad/api test
