name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
  push:
    branches: [main]
    paths:
      - "apps/web/**"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jayedaad/web typecheck
      - run: pnpm --filter @jayedaad/web lint
      - run: pnpm --filter @jayedaad/ui-web test
      - run: pnpm --filter @jayedaad/web test
      - run: pnpm --filter @jayedaad/web build
