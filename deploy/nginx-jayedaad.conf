# /etc/nginx/sites-available/jayedaad
#
# Cloudflare proxies both hostnames (orange cloud), terminating the
# browser-facing TLS itself — this Origin Certificate only secures the
# Cloudflare-edge-to-this-VPS hop (SSL/TLS mode: Full (strict) in the
# Cloudflare dashboard). Plain :80 exists only so Cloudflare's own health
# checks / any non-proxied fallback still gets a response instead of a
# connection refused; it redirects straight to :443.

server {
    listen 80;
    listen [::]:80;
    server_name jayedaad.pk www.jayedaad.pk api.jayedaad.pk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jayedaad.pk www.jayedaad.pk;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.jayedaad.pk;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
