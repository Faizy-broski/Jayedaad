# Postgres is Supabase-hosted (see supabase/migrations/ + SUPABASE_* env
# vars), so only Redis is containerized alongside the app services.
#
# Local dev/verification: `docker compose up --build` builds both images
# from source (see services/api/Dockerfile, apps/web/Dockerfile — both
# require the repo root as build context, which `context: .` below already
# gives them since this file lives at the repo root).
#
# VPS (Phase B): images are built by CI and pushed to GHCR, not built on the
# VPS itself (see .github/workflows/*.yml) — the VPS only ever runs
# `docker compose pull && docker compose up -d --remove-orphans`, which pulls
# the `image:` tags below instead of rebuilding.
#
# Image owner below (faizy-broski) matches the lowercased GitHub repo owner
# that .github/workflows/deploy.yml pushes to
# (ghcr.io/${{ github.repository_owner }}/...) — keep these in sync if the
# repo ever moves to a different org/user.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Loopback-only — no auth on this Redis instance, so it must never be
    # reachable from outside the VPS. Only api/web (same Docker network)
    # need it; this binding is for host-level `redis-cli` debugging only.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jayedaad_redis_data:/data

  api:
    image: ghcr.io/faizy-broski/api:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./services/api/.env
    environment:
      PORT: "3001"
    # Loopback-only — Nginx (host-level) is the only intended entry point,
    # terminating TLS and setting the real Host header. Publishing this to
    # 0.0.0.0 let anyone hit the app directly by raw IP:port, bypassing
    # Nginx/Cloudflare entirely and breaking anything that depends on the
    # real Host header (e.g. the OAuth callback's redirect origin).
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/faizy-broski/web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${NEXT_PUBLIC_GOOGLE_PLACES_API_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Compose sets HOSTNAME to the container's own id/name at creation
      # time, overriding the image's `ENV HOSTNAME=0.0.0.0` (apps/web/
      # Dockerfile) — Next's standalone server.js then binds to that
      # unreachable-from-inside hostname instead of all interfaces. Setting
      # it here wins over Compose's auto-assignment.
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    # Loopback-only — same reasoning as api's port binding above.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  jayedaad_redis_data:
